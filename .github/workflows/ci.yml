name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Shell scripts parse
        run: for f in scripts/*.sh .githooks/commit-msg; do bash -n "$f"; done
      - name: Installer behaviour on fake apt, dnf and pacman systems
        run: ./scripts/test-install-deps.sh
      - name: Release policy (only dev and prod may release)
        run: ./scripts/check-release-config.sh

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: ./scripts/check-commit-msg.sh "$TITLE"
      - name: Commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF..HEAD^2"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range="$SHA"   # new branch: check every commit reachable (history is short)
          fi
          echo "Checking range: $range"
          status=0
          while IFS= read -r subject; do
            ./scripts/check-commit-msg.sh "$subject" || status=1
          done < <(git log --no-merges --format=%s $range)
          exit $status

  installer:
    name: Installer plan on ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "fedora:latest", "archlinux:latest"]
    steps:
      - name: Minimal tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update && apt-get install -y curl python3 ca-certificates
          elif command -v dnf >/dev/null; then dnf install -y curl python3 which
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm curl python which
          fi
      - uses: actions/checkout@v4
      - name: Show what setup would do (changes nothing)
        run: bash scripts/install-deps.sh --list
      - name: Check mode gives a definite answer
        run: |
          set +e
          bash scripts/install-deps.sh --check
          code=$?
          echo "check exit code: $code"
          [ "$code" = 0 ] || [ "$code" = 10 ] || [ "$code" = 2 ]

  packages:
    name: Build packages
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ github.sha }}
